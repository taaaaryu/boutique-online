apiVersion: v1
kind: ServiceAccount
metadata:
  name: locust-runner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: locust-runner
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods","services"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: locust-runner
  namespace: default
subjects:
  - kind: ServiceAccount
    name: locust-runner
    namespace: default
roleRef:
  kind: Role
  name: locust-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-runner
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: locust-runner
      restartPolicy: Never
      volumes:
        - name: results
          emptyDir: {}
      containers:
        - name: runner
          image: locust-runner:v2
          imagePullPolicy: Never
          volumeMounts:
            - name: results
              mountPath: /results
          env:
            - name: TARGET_HOST
              value: "http://frontend.default.svc.cluster.local"
            - name: PROMETHEUS_URL
              value: "http://prometheus.istio-system.svc:9090"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

